# =============================================================================
# Neon Brawl — fait passer le WebSocket du jeu par Apache.
#
# Les navigateurs se connectent à  ws://<IP-de-la-VM>/ws  (port 80, celui
# d'Apache). Apache relaie la connexion au serveur de jeu, qui tourne sur la
# même machine (port 3000). Ainsi, seul le port 80 doit être ouvert.
#
# Installé par deploy/installer.sh dans /etc/apache2/conf-available/,
# avec les modules proxy et proxy_wstunnel.
# =============================================================================
<IfModule mod_proxy_wstunnel.c>
    ProxyPass        /ws  ws://127.0.0.1:3000/ws
    ProxyPassReverse /ws  ws://127.0.0.1:3000/ws
</IfModule>
